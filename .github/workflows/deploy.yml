name: Deploy Frontend to AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          VITE_TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import shlex
          from pathlib import Path

          lines = os.environ.get("ENV_FILE", "").splitlines()
          lines = [line for line in lines if not re.match(r"\s*(?:export\s+)?VITE_KAKAO_CLIENT_SECRET\s*=", line)]
          for name in ("VITE_TOSS_CLIENT_KEY", "VITE_KAKAO_REST_API_KEY"):
              value = os.environ.get(name, "").strip()
              if value:
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"{name} must be a single line")
                  lines = [line for line in lines if not re.match(rf"\s*(?:export\s+)?{name}\s*=", line)]
                  lines.append(f"{name}={json.dumps(value)}")
          values = {}
          for line in lines:
              match = re.match(r"\s*(?:export\s+)?(VITE_TOSS_CLIENT_KEY|VITE_KAKAO_REST_API_KEY)\s*=\s*(.*?)\s*$", line)
              if match:
                  try:
                      parts = shlex.split(match[2], comments=True)
                  except ValueError:
                      raise SystemExit(f"{match[1]} must be a single value")
                  if len(parts) > 1:
                      raise SystemExit(f"{match[1]} must be a single value")
                  values[match[1]] = parts[0] if parts else ""
          if not re.fullmatch(r"(?:test|live)_ck_[A-Za-z0-9]+", values.get("VITE_TOSS_CLIENT_KEY", "")):
              raise SystemExit("Set VITE_TOSS_CLIENT_KEY to the API individual integration client key (test_ck_ or live_ck_)")
          if not values.get("VITE_KAKAO_REST_API_KEY"):
              raise SystemExit("Set VITE_KAKAO_REST_API_KEY")
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PYTHON
          
      - name: Build Project
        run: npm run build
        
      - name: Copy build to AWS temp directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "build/*"
          target: "~/build-temp"
          strip_components: 1

      - name: Move to Nginx directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/build-temp/* /var/www/html/
            rm -rf ~/build-temp
