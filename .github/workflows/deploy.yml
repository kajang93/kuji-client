name: Deploy Frontend to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kuji-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          VITE_TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import shlex
          from pathlib import Path

          lines = os.environ.get("ENV_FILE", "").splitlines()
          lines = [line for line in lines if not re.match(r"\s*(?:export\s+)?VITE_KAKAO_CLIENT_SECRET\s*=", line)]
          for name in ("VITE_TOSS_CLIENT_KEY", "VITE_KAKAO_REST_API_KEY"):
              value = os.environ.get(name, "").strip()
              if value:
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"{name} must be a single line")
                  lines = [line for line in lines if not re.match(rf"\s*(?:export\s+)?{name}\s*=", line)]
                  lines.append(f"{name}={json.dumps(value)}")
          values = {}
          for line in lines:
              match = re.match(r"\s*(?:export\s+)?(VITE_TOSS_CLIENT_KEY|VITE_KAKAO_REST_API_KEY)\s*=\s*(.*?)\s*$", line)
              if match:
                  try:
                      parts = shlex.split(match[2], comments=True)
                  except ValueError:
                      raise SystemExit(f"{match[1]} must be a single value")
                  if len(parts) > 1:
                      raise SystemExit(f"{match[1]} must be a single value")
                  values[match[1]] = parts[0] if parts else ""
          if not re.fullmatch(r"(?:test|live)_ck_[A-Za-z0-9]+", values.get("VITE_TOSS_CLIENT_KEY", "")):
              raise SystemExit("Set VITE_TOSS_CLIENT_KEY to the API individual integration client key (test_ck_ or live_ck_)")
          if not values.get("VITE_KAKAO_REST_API_KEY"):
              raise SystemExit("Set VITE_KAKAO_REST_API_KEY")
          Path(".env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PYTHON
          
      - name: Build Project
        run: npm run build
        
      - name: Record static artifact checksums
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('build')
          files = {path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                   for path in root.rglob('*') if path.is_file() and path.name != 'kuji-release.json'}
          (root / 'kuji-release.json').write_text(json.dumps({'revision': os.environ['GITHUB_SHA'], 'files': files}) + '\n')
          PYTHON

      - name: Prepare private incoming directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: install -d -m 700 "$HOME/kuji-frontend-incoming"

      - name: Copy verified build and deployment helper
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "build,scripts/deploy_frontend.py"
          target: "~/kuji-frontend-incoming/${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Atomically switch release and verify HTTP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            incoming="$HOME/kuji-frontend-incoming/${{ github.run_id }}-${{ github.run_attempt }}"
            sudo python3 "$incoming/scripts/deploy_frontend.py" --source "$incoming/build" --revision "${{ github.sha }}"
